    RoutingRule:
      type: object
      required: [pattern, ingress_topic, priority]
      description: |
        Maps a channel suffix pattern to Kafka topic suffixes with two explicit, mutually exclusive roles. Rules are evaluated in ascending priority order — first match wins. Publishing to a channel no rule matches is rejected with `409 PUBLISH_NOT_ROUTABLE` — never silently routed or dead-lettered.

        **Ingress topic**: the single topic the platform consumes for this rule's channels — its records are delivered to subscribers, replayed on reconnect, and served as message history. The publish ack's `mid` names the ingress record.

        **Egress topics** (optional, Pro edition): additional topics that receive copies of each published message for external consumers (audit trails, analytics export, per-topic retention). Egress topics are created on the broker but NEVER consumed by the platform — an egress copy is never delivered to subscribers, never replayable, and carries no delivery identity. Egress writes happen after the publish ack and never affect it. Each write inherits the producer's bounded retry (`KAFKA_PRODUCER_RECORD_RETRIES`, default 8 attempts, exponential backoff from 100ms); once retries are exhausted — or immediately on a non-retryable error — the copy is dead-lettered to the tenant's `dead-letter` topic with `x-sukko-failure-kind` and `x-sukko-failure-cause` headers and counted. A full dead-letter queue means terminal loss of that copy, surfaced by `ws_routing_dlq_dropped_total`; on graceful shutdown the queued egress backlog is drained within `KAFKA_PRODUCER_SHUTDOWN_TIMEOUT` and anything undrained is counted in `ws_routing_fanout_dropped_total`. For audit-grade guarantees, derive the copy downstream from the ingress topic (e.g. a Kafka Connect sink with `read_committed`) instead — the ingress topic is the single source of truth.

        **Constraints**: no topic suffix may be both an ingress topic and an egress topic anywhere in the tenant's rule set. `dead-letter` is reserved entirely; `default` is reserved as an egress destination (it is always consumed). Total destinations per rule (1 ingress + egress) are capped by `MAX_TOPICS_PER_RULE` (default 10).

        **Pattern syntax**: patterns match by dot-separated **segments**, not characters. `**` matches one or more segments (multi-segment wildcard); at most one `**` is allowed per pattern. A bare `*` segment is accepted as an alias and normalized to `**` on storage (so it too matches one or more segments) — GET responses always return `**`. Literal (non-wildcard) segments must match `[a-z0-9-]+` (lowercase alphanumerics and hyphens; no uppercase or underscore). For example, `trades.**` matches both `trades.BTC-USD` and `trades.spot.BTC-USD`. The `{}` placeholder syntax is NOT supported.

        **Priority**: Rules are evaluated in ascending order (lower value = higher priority). Use lower priority values (e.g., 0–99) for tenant-specific rules; higher values (e.g., 100) work well for broad catch-all rules.
      properties:
        pattern:
          type: string
          maxLength: 256
          pattern: "^[a-z0-9.*-]{1,256}$"
          description: "Channel suffix pattern matched by dot-separated segments. Literal segments must be `[a-z0-9-]+`. Use `**` for a multi-segment wildcard (one or more segments; at most one per pattern), e.g. `trades.**`, `rooms.*.presence`. Bare `*` is accepted and normalized to `**` on storage."
          examples: ["trades.**", "rooms.*.presence", "**"]
        ingress_topic:
          type: string
          maxLength: 200
          pattern: "^[a-z0-9-]{1,200}$"
          description: "Kafka topic suffix the platform consumes and delivers from. Full topic name: `{namespace}.{tenant_slug}.{suffix}`. Must be a pre-provisioned topic."
          examples: ["trades", "default"]
        egress_topics:
          type: array
          maxItems: 9
          items:
            type: string
            maxLength: 200
            pattern: "^[a-z0-9-]{1,200}$"
          description: "Kafka topic suffixes receiving copies for external consumers — written to (with the producer's bounded retry, then dead-lettered on terminal failure), never consumed. Requires Pro edition. Must be pre-provisioned topics, distinct from every ingress topic, and not `default` or `dead-letter`."
          examples: [["audit-log"]]
        priority:
          type: integer
          minimum: 0
          description: "Rule evaluation priority — lower value matches first. Must be unique per tenant."
          examples: [0, 10, 100]

    RoutingRulesResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoutingRule"
        total:
          type: integer
          description: Total number of routing rules for the tenant.
        limit:
          type: integer
          description: Maximum number of items returned per page.
        offset:
          type: integer
          description: Number of items skipped (pagination offset).

    AddRoutingRuleRequest:
