        [ "$code" -eq 0 ] || { echo "VERDICT: sdk-go push suite failed (exit $code)"; exit 1; }
        for t in {{.REQUIRED_TESTS}}; do
          grep -qE -- "--- PASS: $t" /tmp/sdkgo_push.out || { echo "VERDICT: $t did not PASS (skipped/absent) — vacuous green refused"; exit 1; }
