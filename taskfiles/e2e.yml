  cell:pro-kafka:
    desc: "Grid cell — Pro/kafka (full green set; proves suites are backend-agnostic; + token-revocation on the push-smoke cadence)."
    cmds:
      - task: cell
        vars:
          EDITION: pro
          BACKEND: kafka
          SUITES: "channels pubsub ordering reconnect sse auth rest-publish tenant-isolation provisioning token-revocation history gap-recovery sse-recovery"
          # sse-recovery (ADR-0030) is the SSE counterpart to gap-recovery's reconnect leg; it
          # runs here (not community-kafka) because the SSE transport is Pro-gated (features.go
          # SSETransport:Pro). enterprise-kafka runs the lighter backend-agnostic set (like
          # history/gap-recovery, it is absent there), so pro-kafka is the full data-path cell.
          # provisioning: `get audit log` is Enterprise-gated → skips on Pro (the only routing/prov skip here;
          # a non-routing check, so the "no routing ALLOWED_SKIPS on Pro" rule holds).
          # token-revocation: the only two legitimate Pro skips — push-registration-deleted (the push
          # service is not deployed on grid cells) and apikey-survives-revoke (skips by design; no API key in tester config).
          ALLOWED_SKIPS: "provisioning:get audit log;token-revocation:push-registration-deleted;token-revocation:apikey-survives-revoke"
          # Force rest-publish + tenant-isolation delivery checks AND every Pro-reachable provisioning routing
          # check present-and-pass (the base verdict catches only skip/fail/error, not a silently-absent check).
          # rename + test-access are all-editions (not gated) → required present-and-pass here too, no ALLOWED_SKIPS.
          # token-revocation: all 16 fail-closed checks present-and-pass. `sub-force-disconnect-all` is a
          # fail-only setup-collapse alias — NOT listed (present-and-pass on the three per-connection names
          # covers a setup failure); `edition-gate` is deliberately un-enumerated so a Community-misbooted
          # stack reds the cell (its skip is undeclared).
          # scoping deny half (net-new): pubsub subscribe/publish denies + the tenant-isolation cross-tenant
          # subscribe deny are fail-closed gateway-authz checks (no api-key suite on this cell) → require each.
          REQUIRE_PASS: "edition-limits:routing rules within limit;edition-limits:routing rules limit rejection;rest-publish:rest publish → ws receive;rest-publish:rest publish mid equality;rest-publish:rest publish → sse receive;tenant-isolation:tenant A → only A receives;tenant-isolation:tenant B → only B receives;provisioning:routing delete idempotent;provisioning:routing topic gate;provisioning:routing post duplicate pattern;provisioning:routing post duplicate priority;provisioning:routing put duplicate pattern;provisioning:routing rule validation;provisioning:routing role gate read;provisioning:routing role gate write;provisioning:routing cross-tenant mismatch;provisioning:routing get pagination;provisioning:routing get limit cap;provisioning:routing put echo;provisioning:routing star normalization;provisioning:topics create and list;provisioning:topics reserved suffix;provisioning:topics invalid suffix;provisioning:topics duplicate;provisioning:topics delete not-found;provisioning:topics referenced by rule;provisioning:topics role gate read;provisioning:topics role gate write;provisioning:topics pagination;provisioning:topics quota wall;provisioning:rename bad json;provisioning:rename invalid slug;provisioning:rename reserved slug;provisioning:rename slug taken;provisioning:rename role gate;provisioning:rename happy path;provisioning:rename hold period;provisioning:test-access computed patterns;provisioning:test-access no rules;provisioning:test-access bad json;token-revocation:revocation-stream-ready;token-revocation:jti-force-disconnect;token-revocation:jti-reject-reconnect;token-revocation:jti-unaffected;token-revocation:sub-force-disconnect-0;token-revocation:sub-force-disconnect-1;token-revocation:sub-force-disconnect-2;token-revocation:sub-new-token-allowed;token-revocation:sub-old-token-rejected;token-revocation:sub-iat-boundary;token-revocation:sse-force-disconnect;token-revocation:revoke-missing-fields;token-revocation:revoke-both-fields;token-revocation:revoke-tenant-mismatch;token-revocation:revoke-no-active-conn;token-revocation:revoke-idempotent;pubsub:publish auth rejection;pubsub:group subscribe denied;pubsub:user subscribe denied;tenant-isolation:cross-tenant subscribe denied;history:history delivery;history:history mid equality;gap-recovery:gap replay delivery;gap-recovery:live replay delivery;sse-recovery:sse gap replay delivery;sse-recovery:sse replay mid equality"

  cell:enterprise-kafka:
    desc: "Grid cell — Enterprise/kafka (full green set under an Enterprise license)."
    cmds:
      - task: cell
        vars:
          EDITION: enterprise
          BACKEND: kafka
          SUITES: "channels pubsub ordering reconnect sse auth rest-publish"
          # scoping deny half (net-new): pubsub subscribe/publish denies are fail-closed gateway-authz
          # checks (no api-key/tenant-isolation suite on this cell) → require each present-and-pass.
          REQUIRE_PASS: "rest-publish:rest publish → ws receive;rest-publish:rest publish mid equality;rest-publish:rest publish → sse receive;pubsub:publish auth rejection;pubsub:group subscribe denied;pubsub:user subscribe denied"

  cell:pro-webhooks:
    desc: "Grid cell — Pro/kafka webhooks: boots the webhook-worker (--profile pro) and runs the webhook delivery suite (happy-path, retry-on-failure, degraded-state)."
    cmds:
      - task: cell
        vars:
          EDITION: pro
          BACKEND: kafka
          # --profile pro starts the webhook-worker. The e2e boot already injects WEBHOOK_INTERNAL_TOKEN
          # (stack.sh) and the tester compose sets TESTER_WEBHOOK_BASE_URL, so the suite self-provisions
          # the routing rule + webhook subscription and receives deliveries on the tester's own receiver.
          EXTRA_PROFILES: "--profile pro"
          SUITES: "webhooks"
          # Empty ALLOWED_SKIPS (default) already reds the cell on any skip; REQUIRE_PASS is the
          # symmetric guard against the suite VANISHING from the report (a vacuous green) — every
          # webhooks check MUST be present-and-pass. On this Pro/kafka cell with the webhook-worker
          # booted and TESTER_WEBHOOK_BASE_URL set, none of them skip.
          REQUIRE_PASS: "webhooks:webhooks/happy-path/delivery-count;webhooks:webhooks/happy-path/signatures;webhooks:webhooks/happy-path/status-codes;webhooks:webhooks/retry-success/delivery-count;webhooks:webhooks/retry-success/signatures;webhooks:webhooks/retry-success/status-codes;webhooks:webhooks/degraded/delivery-count;webhooks:webhooks/degraded/degraded-status"

  # ---------------------------------------------------------------------------
  # Spec 2 cells — edition-axis widening (paid-direct, negative, degradation).
  # ---------------------------------------------------------------------------
  cell:pro-direct:
    desc: "Grid cell — Pro/direct (full green set + edition-limits; restores sse-on-direct; + token-revocation)."
    cmds:
      - task: cell
        vars:
          EDITION: pro
          BACKEND: direct
          SUITES: "channels pubsub ordering reconnect sse auth edition-limits rest-publish tenant-isolation provisioning token-revocation"
          # Pro's 10000-conn limit exceeds the 100-conn test cap → the boundary sub-check skips.
          # provisioning: `get audit log` is Enterprise-gated → skips on Pro (non-routing skip).
          # token-revocation: the only two legitimate Pro skips — push-registration-deleted (the push
          # service is not deployed on grid cells) and apikey-survives-revoke (skips by design; no API key in tester config).
          ALLOWED_SKIPS: "edition-limits:connection limit rejection;provisioning:get audit log;token-revocation:push-registration-deleted;token-revocation:apikey-survives-revoke"
          # Force rest-publish + tenant-isolation delivery checks AND every Pro-reachable provisioning routing
          # check present-and-pass. Routing gates identically off-Kafka (noop topic registry, main.go:216).
          # rename + test-access are all-editions (not gated) → required present-and-pass here too, no ALLOWED_SKIPS.
          # token-revocation: all 16 fail-closed checks present-and-pass. `sub-force-disconnect-all` is a
          # fail-only setup-collapse alias — NOT listed (present-and-pass on the three per-connection names
          # covers a setup failure); `edition-gate` is deliberately un-enumerated so a Community-misbooted
          # stack reds the cell (its skip is undeclared).
          # scoping deny half (net-new): pubsub subscribe/publish denies + the tenant-isolation cross-tenant
          # subscribe deny are fail-closed gateway-authz checks (no api-key suite on this cell) → require each.
          REQUIRE_PASS: "edition-limits:routing rules within limit;edition-limits:routing rules limit rejection;rest-publish:rest publish → ws receive;rest-publish:rest publish mid equality;rest-publish:rest publish → sse receive;tenant-isolation:tenant A → only A receives;tenant-isolation:tenant B → only B receives;provisioning:routing delete idempotent;provisioning:routing topic gate;provisioning:routing post duplicate pattern;provisioning:routing post duplicate priority;provisioning:routing put duplicate pattern;provisioning:routing rule validation;provisioning:routing role gate read;provisioning:routing role gate write;provisioning:routing cross-tenant mismatch;provisioning:routing get pagination;provisioning:routing get limit cap;provisioning:routing put echo;provisioning:routing star normalization;provisioning:topics create and list;provisioning:topics reserved suffix;provisioning:topics invalid suffix;provisioning:topics duplicate;provisioning:topics delete not-found;provisioning:topics referenced by rule;provisioning:topics role gate read;provisioning:topics role gate write;provisioning:topics pagination;provisioning:topics quota wall;provisioning:rename bad json;provisioning:rename invalid slug;provisioning:rename reserved slug;provisioning:rename slug taken;provisioning:rename role gate;provisioning:rename happy path;provisioning:rename hold period;provisioning:test-access computed patterns;provisioning:test-access no rules;provisioning:test-access bad json;token-revocation:revocation-stream-ready;token-revocation:jti-force-disconnect;token-revocation:jti-reject-reconnect;token-revocation:jti-unaffected;token-revocation:sub-force-disconnect-0;token-revocation:sub-force-disconnect-1;token-revocation:sub-force-disconnect-2;token-revocation:sub-new-token-allowed;token-revocation:sub-old-token-rejected;token-revocation:sub-iat-boundary;token-revocation:sse-force-disconnect;token-revocation:revoke-missing-fields;token-revocation:revoke-both-fields;token-revocation:revoke-tenant-mismatch;token-revocation:revoke-no-active-conn;token-revocation:revoke-idempotent;pubsub:publish auth rejection;pubsub:group subscribe denied;pubsub:user subscribe denied;tenant-isolation:cross-tenant subscribe denied"

  cell:enterprise-direct:
    desc: "Grid cell — Enterprise/direct (full green set + edition-limits; unlimited path, no skips)."
    cmds:
      - task: cell
        # Enterprise is unlimited: edition-limits early-returns per boundary with no skip, so this
        # cell declares NO allowed skips (the empty ALLOWED_SKIPS default) — any skip reds the cell.
        vars:
          EDITION: enterprise
          BACKEND: direct
          SUITES: "channels pubsub ordering reconnect sse auth edition-limits rest-publish"
          # Force both rest-publish delivery checks present-and-pass (the base verdict catches only
          # skip/fail/error, not a silently-absent check).
          # scoping deny half (net-new): pubsub subscribe/publish denies are fail-closed gateway-authz
          # checks (no api-key/tenant-isolation suite on this cell) → require each present-and-pass.
          REQUIRE_PASS: "rest-publish:rest publish → ws receive;rest-publish:rest publish mid equality;rest-publish:rest publish → sse receive;pubsub:publish auth rejection;pubsub:group subscribe denied;pubsub:user subscribe denied"

  # NOTE: there is no `expired-direct` grid cell. Under ADR-0038 an expired key is
  # refused at startup (it no longer degrades to Community), so a stack cannot BOOT on
  # an expired license — there is nothing for a source-build cell to assert at runtime.
  # The "expired key refuses to boot" behavior is covered by Go unit tests
  # (license.TestNewManager_ExpiredAtStartup, the provisioning resolve/config tests),
  # and Community limit enforcement is proven by cell:community-direct's edition-limits
  # REQUIRE_PASS checks.

  cell:community-kafka:
    desc: >-
      Grid cell — Community/kafka (ADR-0009: the data path — Kafka backend, history, gap
      recovery, REST publish — is Community; capacity caps are the tier wall). Proves the
      free tier BOOTS on the kafka backend, its gate surface holds, AND the ingest data
      path DELIVERS — produce directly to the tenant topic, a gateway-subscribed client
      receives it, license-free (the ADR-0009 benchmark claim).
    cmds:
      - task: cell
        vars:
          EDITION: community
          BACKEND: kafka
          # Client-publish-shaped suites (pubsub/ordering/reconnect/rest-publish delivery)
          # cannot run here: client publish into kafka requires provisioned routing rules
          # (ChannelTopicRouting is ungated since ADR-0014, but this cell is not yet gated for client-publish delivery). The INGEST
          # path needs no routing rules — kafka-ingest produces straight to the tenant
          # topic and asserts a subscribed client receives the fan-out — so it is the
          # delivery proof this cell owns: Community+kafka is ingest-only BY DESIGN, and
          # this cell proves that exact shape works license-free. history/gap-recovery
          # ingest records directly too, so they run here as well. (sse-recovery is NOT
          # here: it rides the SSE transport, which is Pro-gated — features.go
          # SSETransport:Pro — so a Community SSE connect is 403'd; sse-recovery runs on
          # pro-kafka only, matching where the basic `sse` suite runs.)
          SUITES: "channels auth edition-limits kafka-ingest history gap-recovery"
          # edition-limits: the connection-boundary sub-check honestly skips (Community's 500-conn
          # limit exceeds the 100-conn test cap).
          ALLOWED_SKIPS: "edition-limits:connection limit rejection"
          # "rest publish open" proves the endpoint carries no edition gate (409
          # PUBLISH_NOT_ROUTABLE path on Community+kafka); "kafka-ingest delivery" proves
          # the free-tier ingest→fan-out path delivers (it would SKIP if the tester's
          # KAFKA_BROKERS wiring regressed — present-and-pass closes that hole); the
          # history/gap-recovery delivery+mid checks prove the remaining ADR-0009 free
          # data-path claims AND the ADR-0008 mid identity triple (live == history ==
          # replay), all license-free.
          REQUIRE_PASS: "edition-limits:rest publish open;kafka-ingest:kafka-ingest delivery;history:history delivery;history:history mid equality;gap-recovery:gap replay delivery;gap-recovery:live replay delivery"

  validate-battery:
    desc: >-
      Validate battery on the direct backend — the Community/direct grid cell. (Re-expressed
      via the cell runner; sse moved to the kafka cells, which unlock the Pro-gated feature.)
    cmds:
      - task: cell:community-direct

  license-reload:
    desc: Run license hot-reload validation (requires dev signing key)
    cmds:
      - |
        if [ ! -f "{{.DEV_KEY_PATH}}" ] || [ ! -f "{{.DEV_PUB_PATH}}" ]; then
          echo "Dev signing key incomplete — generating..."
          cd ws && go run ./internal/shared/license/genkeys
        fi
      - |
        echo "=== Running license-reload validation suite ==="
        # The tester signing_key field now carries the PEM PKCS#8 ECDSA P-256 key
        # TEXT directly (no base64) — file content == API content. jq -Rs
        # slurps the raw PEM (newlines and all) and JSON-escapes it safely.
        curl -sf http://localhost:8090/api/v1/tests \
          -H 'Content-Type: application/json' \
          -d "$(jq -Rs --arg suite license-reload '{type:"validate",suite:$suite,signing_key:.}' < {{.DEV_KEY_PATH}})"
        echo ""
        echo "=== License-reload validation complete ==="
