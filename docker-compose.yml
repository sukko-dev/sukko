# Sukko WebSocket Infrastructure — Local Development
#
# SOURCE OF TRUTH: This file is the canonical docker-compose definition.
# It is automatically synced to sukko-cli (compose/docker-compose.yml) via CI,
# where build: blocks are transformed to image: references for end users.
# See: .github/workflows/sync-compose.yml
#
# Why here and not in sukko-cli?
# The compose file is coupled to the Go codebase — env var names, ports, healthcheck
# paths, and service topology must match the Go config contract (platform.BaseConfig,
# ServerConfig, etc.). Keeping it alongside the code ensures changes to the config
# contract and compose file happen in the same PR.
#
# Start: docker compose up
# Stop:  docker compose down
# Reset: docker compose down -v
#
# Default mode: direct + Valkey broadcast + PostgreSQL (zero config needed)
# All application config uses Go envDefault values.
# Only inter-service wiring env vars are set here.
#
# Optional infrastructure (activate via Docker Compose profiles):
#   docker compose --profile kafka up         # Redpanda (Kafka)

services:
  # ─── Provisioning API ─────────────────────────────────────────────
  provisioning:
    build:
      context: ./ws
      dockerfile: build/provisioning/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-local}
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}  # set to sukko_e2e for the license e2e cell (embeds the dev key)
    ports:
      - "18080:8080"
      - "19090:9090"
    environment:
      ADMIN_BOOTSTRAP_KEY: "${ADMIN_BOOTSTRAP_KEY:-}"  # base64 Ed25519 public key, set by sukko init
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-}"  # 32-byte hex key, auto-generated by sukko init
      DATABASE_URL: "postgres://sukko:sukko@postgres:5432/sukko?sslmode=disable"
      SUKKO_LICENSE_KEY: "${SUKKO_LICENSE_KEY:-}"
      # Explicit topic namespace prefix ({namespace}.{tenant}.{suffix}). Provisioning always builds
      # topic-name strings, so this is required even in the default Community/direct stack.
      KAFKA_TOPIC_NAMESPACE: "${KAFKA_TOPIC_NAMESPACE:-local}"
      # Pro/Enterprise: shared secret for webhook-worker ↔ provisioning gRPC auth.
      WEBHOOK_INTERNAL_TOKEN: "${WEBHOOK_INTERNAL_TOKEN:-}"
      # Pro/Enterprise: internal gRPC address of the webhook-worker service.
      WEBHOOK_WORKER_GRPC_ADDR: "${WEBHOOK_WORKER_GRPC_ADDR:-webhook-worker:9095}"
      # Connections registry Valkey client — required (no Go default for PROVISIONING_VALKEY_ADDRS).
      PROVISIONING_VALKEY_ADDRS: "valkey:6379"
      # Observability (disabled by default, enable with OTEL_TRACING_ENABLED=true)
      OTEL_TRACING_ENABLED: "${OTEL_TRACING_ENABLED:-false}"
      OTEL_EXPORTER_ENDPOINT: "tempo:4317"
      PPROF_ENABLED: "${PPROF_ENABLED:-false}"
      PYROSCOPE_ENABLED: "${PYROSCOPE_ENABLED:-false}"
      PYROSCOPE_ADDR: "http://pyroscope:4040"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── WebSocket Server ─────────────────────────────────────────────
  ws-server:
    build:
      context: ./ws
      dockerfile: build/server/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-local}
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}  # set to sukko_e2e for the license e2e cell (embeds the dev key)
    ports:
      - "3005:3005"
    # NOTE: list syntax (deviates from other services' map syntax — §XVIII) is required for
    # the bare-key MESSAGE_BACKEND passthrough below. A bare key forwards the host/compose-
    # process value only when set and is OMITTED when unset (→ Go envDefault "direct").
    # Map-syntax ${MESSAGE_BACKEND:-} would inject an empty string and fail
    # MessageBackendConfig.Validate(); ${MESSAGE_BACKEND:-direct} would duplicate the Go
    # default (§I). Bare-key list passthrough is the only form yielding genuine absence.
    environment:
      # Inter-service wiring (only overrides needed)
      - VALKEY_ADDRS=valkey:6379
      - PROVISIONING_GRPC_ADDR=provisioning:9090
      - SUKKO_LICENSE_KEY=${SUKKO_LICENSE_KEY:-}
      # Pod identity — required for connections registry key namespacing (no Go default).
      - WS_POD_ID=ws-server-local
      # Connections registry — opt in for local dev (Pro+ license required).
      - WS_CONNECTIONS_REGISTRY_ENABLED=${WS_CONNECTIONS_REGISTRY_ENABLED:-false}
      # Observability (disabled by default, enable with OTEL_TRACING_ENABLED=true)
      - OTEL_TRACING_ENABLED=${OTEL_TRACING_ENABLED:-false}
      - OTEL_EXPORTER_ENDPOINT=tempo:4317
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-false}
      - PYROSCOPE_ADDR=http://pyroscope:4040
      # Kafka mode (available on every edition, ADR-0009; opt-in): set MESSAGE_BACKEND=kafka
      # and add `--profile kafka`. Client publish into kafka needs Pro routing rules
      # (ChannelTopicRouting); ingest/fan-out runs license-free. Unset ⇒ omitted ⇒ direct
      # (the zero-dependency default on all editions).
      - MESSAGE_BACKEND
      - KAFKA_BROKERS=redpanda:9092
      # Explicit topic namespace prefix; required when MESSAGE_BACKEND=kafka (ignored in direct mode).
      - KAFKA_TOPIC_NAMESPACE=${KAFKA_TOPIC_NAMESPACE:-local}
    depends_on:
      valkey:
        condition: service_healthy
      provisioning:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─── WebSocket Gateway ────────────────────────────────────────────
  ws-gateway:
    build:
      context: ./ws
      dockerfile: build/gateway/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-local}
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}  # set to sukko_e2e for the license e2e cell (embeds the dev key)
    ports:
      - "13000:3000"
    environment:
      # Inter-service wiring (only overrides needed)
      GATEWAY_BACKEND_URL: "ws://ws-server:3005/ws"
      PROVISIONING_GRPC_ADDR: "provisioning:9090"
      SERVER_GRPC_ADDR: "ws-server:3006"
      PUSH_GRPC_ADDR: "push-service:3008"
      # Push surface opt-in: set GATEWAY_PUSH_ENABLED=true when running the push
      # profile (the routes 404 without it; the push service is deploy-optional).
      GATEWAY_PUSH_ENABLED: "${GATEWAY_PUSH_ENABLED:-false}"
      SUKKO_LICENSE_KEY: "${SUKKO_LICENSE_KEY:-}"
      # Observability (disabled by default, enable with OTEL_TRACING_ENABLED=true)
      OTEL_TRACING_ENABLED: "${OTEL_TRACING_ENABLED:-false}"
      OTEL_EXPORTER_ENDPOINT: "tempo:4317"
      PPROF_ENABLED: "${PPROF_ENABLED:-false}"
      PYROSCOPE_ENABLED: "${PYROSCOPE_ENABLED:-false}"
      PYROSCOPE_ADDR: "http://pyroscope:4040"
    depends_on:
      ws-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─── Push Service — activate with: --profile enterprise --profile kafka ──
  # (Pro+ license required — Web Push; FCM/APNs delivery needs Enterprise. The
  # profile keeps its historical "enterprise" name until the sukko-cli embedded
  # compose is renamed in lockstep.)
  push-service:
    build:
      context: ./ws
      dockerfile: build/push/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-local}
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}  # set to sukko_e2e for the license e2e cell (embeds the dev key)
    profiles: ["enterprise"]
    ports:
      - "3008:3008"
      - "3009:3009"
    environment:
      PUSH_DRY_RUN: "true"
      MESSAGE_BACKEND: kafka
      DATABASE_URL: "postgres://sukko:sukko@postgres:5432/sukko?sslmode=disable"
      PROVISIONING_GRPC_ADDR: "provisioning:9090"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_TOPIC_NAMESPACE: "${KAFKA_TOPIC_NAMESPACE:-local}"  # push always requires an explicit namespace
      PUSH_GRPC_PORT: "3008"
      PUSH_HTTP_PORT: "3009"
      ENVIRONMENT: local
      SUKKO_LICENSE_KEY: "${SUKKO_LICENSE_KEY:-}"  # push needs a Pro+ license (WebPush); without this the enterprise profile fatals at LoadConfig (§XVIII: every other licensed service has this passthrough)
    depends_on:
      provisioning:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3009/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── Tester Service ────────────────────────────────────────────────
  sukko-tester:
    build:
      context: ./ws
      dockerfile: build/tester/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-local}
    ports:
      - "8090:8090"
    environment:
      GATEWAY_URL: "ws://ws-gateway:3000"
      # Gateway metrics BASE URL (suites append /metrics) — lets the token-revocation suite gate
      # on the revocation stream being connected before revoking
      # (gateway_token_revocation_stream_state). Matches the soak/stress revocation suites' usage.
      TESTER_GATEWAY_METRICS_URL: "http://ws-gateway:3000"
      PROVISIONING_URL: "http://provisioning:8080"
      TESTER_AUTH_TOKEN: "sukko-dev-token"
      # KAFKA_BROKERS intentionally unset: this compose runs ws-server in direct
      # mode by default, so the kafka-ingest suite correctly SKIPS here. Running
      # kafka-ingest requires a kafka-backend server (any edition; its rest-publish
      # produce leg needs Pro routing rules) — provided by the dedicated e2e
      # harness, not the operator quick-start compose.
      # Explicit topic namespace, required once KAFKA_BROKERS is set (kafka override);
      # MUST match the server-under-test's KAFKA_TOPIC_NAMESPACE.
      KAFKA_TOPIC_NAMESPACE: "${KAFKA_TOPIC_NAMESPACE:-local}"
      # Webhook delivery base URL — the address webhook-worker uses to POST deliveries back
      # to this tester pod. Only relevant when running with --profile pro (webhook-worker).
      TESTER_WEBHOOK_BASE_URL: "http://sukko-tester:8090"
    depends_on:
      ws-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ─── Webhook Worker — activate with: --profile pro ───────────────────
  webhook-worker:
    build:
      context: ./ws
      dockerfile: build/webhook-worker/Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-local}
    profiles: ["pro"]
    ports:
      - "8083:8083"
    environment:
      WEBHOOK_WORKER_PROVISIONING_GRPC_ADDR: "provisioning:9091"
      WEBHOOK_WORKER_VALKEY_ADDRS: "valkey:6379"
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-}"
      SUKKO_LICENSE_KEY: "${SUKKO_LICENSE_KEY:-}"
      WEBHOOK_INTERNAL_TOKEN: "${WEBHOOK_INTERNAL_TOKEN:-}"
      # Allow http:// and private-IP delivery targets in local dev.
      WEBHOOK_ALLOW_HTTP: "true"
      WEBHOOK_ALLOW_PRIVATE_IPS: "true"
      # Observability (disabled by default, enable with OTEL_TRACING_ENABLED=true)
      OTEL_TRACING_ENABLED: "${OTEL_TRACING_ENABLED:-false}"
      OTEL_EXPORTER_ENDPOINT: "tempo:4317"
      PPROF_ENABLED: "${PPROF_ENABLED:-false}"
      PYROSCOPE_ENABLED: "${PYROSCOPE_ENABLED:-false}"
      PYROSCOPE_ADDR: "http://pyroscope:4040"
    depends_on:
      provisioning:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── Redpanda (Kafka) — activate with: --profile kafka ─────────────
  redpanda:
    profiles: ["kafka"]
    image: redpandadata/redpanda:v24.1.1
    ports:
      - "19092:19092"
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    # Dev image includes pg_partman for analytics partition tests.
    # End users receive image: postgres:16-alpine (sync-compose.yml strips build:).
    build:
      context: ./docker/postgres-dev
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: sukko
      POSTGRES_PASSWORD: sukko
      POSTGRES_DB: sukko
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukko"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Valkey (default broadcast bus) ───────────────────────────────
  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Observability stack — activate with: --profile observability ────
  # Adds Prometheus, Grafana, Tempo (tracing), Pyroscope (profiling),
  # and AlertManager. All configs inlined via docker compose configs.

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.47.0
    ports:
      - "19091:9090"
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alert-rules
        target: /etc/prometheus/rules/alert-rules.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.2.0
    ports:
      - "3030:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.3.1
    ports:
      - "3200:3200"
      - "14317:4317"
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yml
    command: ["-config.file=/etc/tempo/tempo.yml"]

  pyroscope:
    profiles: ["observability"]
    image: grafana/pyroscope:1.4.0
    ports:
      - "4040:4040"

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]

# ─── Inline configs for observability stack ──────────────────────────
configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      rule_files:
        - /etc/prometheus/rules/*.yml
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ['alertmanager:9093']
      scrape_configs:
        - job_name: ws-server
          static_configs:
            - targets: ['ws-server:3005']
          metrics_path: /metrics
        - job_name: ws-gateway
          static_configs:
            - targets: ['ws-gateway:3000']
          metrics_path: /metrics
        - job_name: provisioning
          static_configs:
            - targets: ['provisioning:8080']
          metrics_path: /metrics
        # webhook-worker is profile "pro"; prometheus is profile "observability" — no shared
        # profile. When running --profile observability without --profile pro, this target
        # appears DOWN in the Prometheus UI. The ServiceDown alert excludes webhook-worker
        # (it filters on job=~"ws-server|ws-gateway|provisioning"), so no false alert fires.
        - job_name: webhook-worker
          static_configs:
            - targets: ['webhook-worker:8083']
          metrics_path: /metrics
        - job_name: prometheus
          static_configs:
            - targets: ['localhost:9090']

  # Keep in sync with deployments/helm/sukko/charts/monitoring/templates/prometheus-alert-rules-configmap.yaml
  prometheus-alert-rules:
    content: |
      groups:
        - name: sukko-capacity
          rules:
            - alert: HighConnectionCapacity
              expr: ws_connections_active / ws_connections_max > 0.8
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Connection capacity above 80%"
                runbook_url: "https://docs.sukko.dev/runbooks/high-connection-capacity"
            - alert: CriticalConnectionCapacity
              expr: ws_connections_active / ws_connections_max > 0.95
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Connection capacity above 95%"
                runbook_url: "https://docs.sukko.dev/runbooks/critical-connection-capacity"
        - name: sukko-errors
          rules:
            - alert: HighErrorRate
              expr: rate(ws_errors_total[5m]) > 0.01 * rate(ws_messages_received_total[5m])
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Error rate exceeds 1% of message throughput"
                runbook_url: "https://docs.sukko.dev/runbooks/high-error-rate"
        - name: sukko-infrastructure
          rules:
            - alert: KafkaConsumerLag
              expr: ws_kafka_consumer_lag > 1000
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Kafka consumer lag exceeds 1000 messages"
                runbook_url: "https://docs.sukko.dev/runbooks/kafka-consumer-lag"
            - alert: HighMemoryUsage
              expr: ws_memory_bytes / ws_memory_limit_bytes > 0.8
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Memory usage above 80% of limit"
                runbook_url: "https://docs.sukko.dev/runbooks/high-memory-usage"
            - alert: LicenseExpiringSoon
              expr: (sukko_license_expiry_timestamp - time()) < 7 * 86400
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "License expires within 7 days"
                runbook_url: "https://docs.sukko.dev/runbooks/license-expiring-soon"
            - alert: ServiceDown
              expr: up{job=~"ws-server|ws-gateway|provisioning"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$labels.job }} is down"
                runbook_url: "https://docs.sukko.dev/runbooks/service-down"

  tempo-config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
      storage:
        trace:
          backend: local
          local:
            path: /tmp/tempo/blocks
          wal:
            path: /tmp/tempo/wal
      compactor:
        compaction:
          block_retention: 168h

  alertmanager-config:
    content: |
      global:
        resolve_timeout: 5m
      route:
        receiver: console
        group_by: ['alertname', 'severity']
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 1h
      receivers:
        - name: console

  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki:3100
          editable: false
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo:3200
          editable: false
        - name: Pyroscope
          type: grafana-pyroscope-datasource
          uid: pyroscope
          access: proxy
          url: http://pyroscope:4040
          editable: false

volumes:
  postgres-data:
